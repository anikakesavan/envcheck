[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envcheck"
version = "0.1.0"
description = "Catch missing or misconfigured .env variables before they bite you."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Anika Kesavan" }]

[project.scripts]
envcheck = "envcheck.cli:main"

[tool.setuptools.packages.find]
include = ["envcheck*"]
